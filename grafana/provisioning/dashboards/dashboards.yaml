apiVersion: 1

providers:
  - name: 'OTEL Dashboards'
    orgId: 1
    folder: 'OpenTelemetry'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards/otel.json
  - name: 'Host Metrics Dashboards'
    orgId: 1
    folder: 'Host Metrics'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards/hostmetrics.json
