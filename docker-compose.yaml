services:
  # OpenTelemetry Collector - 3 replicas
  otel-collector:
    build: 
      context: ./bootstrap/remote
      dockerfile: Containerfile
    deploy:
      replicas: 3
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      - otel-net
    restart: unless-stopped

  # Victoria Metrics for metrics collection
  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoria-metrics
    # ports:
    #   - "9091:8428"  # Victoria Metrics web interface
    #   - "8089:8089"  # InfluxDB line protocol endpoint
    expose:
      - "9091"  # Victoria Metrics web interface
      - "8089"  # InfluxDB line protocol endpoint
    volumes:
      - victoria_metrics_data:/victoria-metrics-data
    command:
      - '--storageDataPath=/victoria-metrics-data'
      - '--retentionPeriod=200h'
      - '--httpListenAddr=:8428'
      - '--influxListenAddr=:8089'  # Enable InfluxDB line protocol endpoint
      - '--maxConcurrentInserts=8'
      - '--maxInsertRequestSize=32MB'
      - '--enableTCP6=false'  # Disable IPv6 to avoid potential issues
      - '--search.maxQueryDuration=30m'  # Allow longer queries
      - '--search.maxConcurrentRequests=8'  # Limit concurrent search requests
    networks:
      - otel-net
    restart: unless-stopped
    depends_on:
      - otel-collector

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/hostmetrics-dashboard-advance.json
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - otel-net
    restart: unless-stopped
    depends_on:
      - victoria-metrics

volumes:
  victoria_metrics_data:
  grafana_data:

networks:
  otel-net:
    driver: bridge
